<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twagalane • Super Admin</title>

<link rel="stylesheet" href="Css/admin-login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="bg-animation"></div>

<div id="toastContainer"></div>

<div class="login-wrapper">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="logo-box">

            <div class="logo-circle">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1>Nansubuga Corporate</h1>

            <span>SUPER ADMIN PORTAL</span>

        </div>

        <div class="welcome-box">

            <h2>System Management</h2>

            <p>Authorised administrators only.</p>

        </div>

        <div class="system-status">

            <div class="status-card">

                <i class="fa-solid fa-circle-check"></i>

                <div>

                    <h3>System Status</h3>

                    <span id="systemStatus">Online</span>

                </div>

            </div>

            <div class="status-card">

                <i class="fa-solid fa-lock"></i>

                <div>

                    <h3>Security</h3>

                    <span>Protected Login</span>

                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="login-card">

            <h2>Admin Login</h2>

            <p>Sign in with your administrator account.</p>

            <form id="loginForm">

                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                        <button
                        type="button"
                        id="togglePassword">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="form-options">

                    <label>

                        <input
                        type="checkbox"
                        id="rememberMe">

                        Remember me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button
                type="submit"
                id="loginBtn"
                class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </form>

            <div class="footer">

                © 2026 Nansubuga Corporate Affairs International Ltd

            </div>

        </div>

    </div>

</div>

<script type="module" src="javascript/admin-login.js"></script>

</body>

</html>
