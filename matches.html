===================================-->

            ❤️ Matches

<!--==================================

===================================-->

<section id="matchesSection">

    <div id="cardStack">

        <!-- Generated by JS -->

    </div>

</section>

    <div id="chatUsers">

        <!-- JS -->

    </div>

</section>

<section id="premiumBanner">

    <img
        id="premiumImage"
        src="assets/premium/premium1.jpg"
        alt="Premium">

    <div class="premium-overlay"></div>

    <div class="premium-content">

        <span class="premium-badge">

            💎 PREMIUM

        </span>

        <h2 id="premiumTitle">

            Find Love Faster

        </h2>

        <p id="premiumDescription">

            Unlock unlimited chats,
            clear profile photos,
            priority AI matching
            and exclusive features.

        </p>

        <button
            id="upgradeBtn">

            Upgrade Now

        </button>

    </div>

</section>

<!--==================================
        PEOPLE WHO LIKED YOU
===================================-->

<section id="likedSection">

    <div class="section-title">

        <h2>

            ❤️ Liked You

        </h2>

        <a href="premium.html">

            Unlock

        </a>

    </div>

    <div id="likedSlider">

        <!-- Generated by JS -->

    </div>

</section>

<!--==================================
        QUICK STATS
===================================-->

<section id="statsSection">

    <div class="stat-card">

        <h3 id="likesCount">

            0

        </h3>

        <span>

            Likes

        </span>

    </div>

    <div class="stat-card">

        <h3 id="matchesCount">

            0

        </h3>

        <span>

            Matches

        </span>

    </div>

    <div class="stat-card">

        <h3 id="chatCount">

            0

        </h3>

        <span>

            Chats

        </span>

    </div>

</section>

<!--==================================
        MATCH TIPS
===================================-->

<section id="tipsCard">

    <div class="tips-icon">

        ✨

    </div>

    <div>

        <h3>

            Match Tip

        </h3>

        <p id="matchTip">

            Profiles with more photos receive more matches.

        </p>

    </div>

</section>
