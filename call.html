<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Call</title>

<link
rel="stylesheet"
href="css/call.css">

</head>

<body>

<div class="call-screen">

    <!--==========================
            BACKGROUND
    ===========================-->

    <div class="call-overlay"></div>

    <!--==========================
            USER
    ===========================-->

    <div class="call-user">

        <img
        id="callPhoto"
        src="assets/avatar.png"
        class="call-avatar">

        <h2 id="callName">

            Loading...

        </h2>

        <p id="callStatus">

            Calling...

        </p>

        <span id="callTimer">

            00:00

        </span>

    </div>

    <!--==========================
            REMOTE VIDEO
    ===========================-->

    <video
    id="remoteVideo"
    autoplay
    playsinline>

    </video>

    <!--==========================
            LOCAL VIDEO
    ===========================-->

    <video
    id="localVideo"
    autoplay
    muted
    playsinline>

    </video>
<!--==========================
        CONTROLS
===========================-->

<div class="call-controls">

    <!--==========================
            MUTE
    ===========================-->

    <button
        id="muteBtn"
        class="call-btn"
        type="button"
        aria-label="Mute microphone">

        <img
            src="assets/mute.svg"
            alt="Mute"
            class="call-icon">

    </button>


    <!--==========================
            SPEAKER
    ===========================-->

    <button
        id="speakerBtn"
        class="call-btn"
        type="button"
        aria-label="Speaker">

        <img
            src="assets/microphone.svg"
            alt="Speaker"
            class="call-icon">

    </button>


    <!--==========================
            CAMERA
    ===========================-->

    <button
        id="cameraBtn"
        class="call-btn"
        type="button"
        aria-label="Camera">

        <img
            src="assets/camera.svg"
            alt="Camera"
            class="call-icon">

    </button>


    <!--==========================
        SWITCH CAMERA
    ===========================-->

    <button
        id="switchCameraBtn"
        class="call-btn"
        type="button"
        aria-label="Switch camera">

        <img
            src="assets/switch-camera.svg"
            alt="Switch camera"
            class="call-icon">

    </button>


    <!--==========================
            END CALL
    ===========================-->

    <button
        id="endCallBtn"
        class="call-btn end"
        type="button"
        aria-label="End call">

        <img
            src="assets/end-call.svg"
            alt="End call"
            class="call-icon end-call-icon">

    </button>

</div>

</div>

<script
type="module"
src="javascript/call.js"></script>


</body>

</html>
