<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Call</title>

<link
rel="stylesheet"
href="css/call.css">

</head>

<body>

<div class="call-screen">

    <!--==========================
            BACKGROUND
    ===========================-->

    <div class="call-overlay"></div>

    <!--==========================
            USER
    ===========================-->

    <div class="call-user">

        <img
        id="callPhoto"
        src="assets/avatar.png"
        class="call-avatar">

        <h2 id="callName">

            Loading...

        </h2>

        <p id="callStatus">

            Calling...

        </p>

        <span id="callTimer">

            00:00

        </span>

    </div>

    <!--==========================
            REMOTE VIDEO
    ===========================-->

    <video
    id="remoteVideo"
    autoplay
    playsinline>

    </video>

    <!--==========================
            LOCAL VIDEO
    ===========================-->

    <video
    id="localVideo"
    autoplay
    muted
    playsinline>

    </video>

    <!--==========================
            CONTROLS
    ===========================-->

    <div class="call-controls">

        <!-- Mute -->

        <button
        id="muteBtn"
        class="call-btn">

            <svg
            viewBox="0 0 24 24"
            width="26"
            height="26">

                <path

                d="M12 3v10m0 0a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v3a3 3 0 0 0 3 3zm5-3v1a5 5 0 0 1-10 0v-1m5 6v4m-3 0h6"

                fill="none"

                stroke="currentColor"

                stroke-width="2"

                stroke-linecap="round"

                stroke-linejoin="round"/>

            </svg>

        </button>

        <!-- Speaker -->

        <button
        id="speakerBtn"
        class="call-btn">

            <svg
            viewBox="0 0 24 24"
            width="26"
            height="26">

                <path

                d="M5 9v6h4l5 4V5L9 9H5zm12 3a3 3 0 0 0-2-2.82m2 8.82a7 7 0 0 0 0-12"

                fill="none"

                stroke="currentColor"

                stroke-width="2"

                stroke-linecap="round"

                stroke-linejoin="round"/>

            </svg>

        </button>

        <!-- Camera -->

        <button
        id="cameraBtn"
        class="call-btn">

            <svg
            viewBox="0 0 24 24"
            width="26"
            height="26">

                <path

                d="M23 7l-7 5 7 5V7zM1 6h15v12H1z"

                fill="none"

                stroke="currentColor"

                stroke-width="2"

                stroke-linejoin="round"/>

            </svg>

        </button>

        <!-- Switch Camera -->

        <button
        id="switchCameraBtn"
        class="call-btn">

            <svg
            viewBox="0 0 24 24"
            width="26"
            height="26">

                <path

                d="M4 7h5l2-2h2l2 2h5v10H4zm3 7l-2-2 2-2m10 4l2-2-2-2"

                fill="none"

                stroke="currentColor"

                stroke-width="2"

                stroke-linecap="round"

                stroke-linejoin="round"/>

            </svg>

        </button>

        <!-- End Call -->

        <button
        id="endCallBtn"
        class="call-btn end">

            <svg
            viewBox="0 0 24 24"
            width="28"
            height="28">

                <path

                d="M4.5 15.5c4.2-4.2 10.8-4.2 15 0"

                fill="none"

                stroke="white"

                stroke-width="2.5"

                stroke-linecap="round"/>

            </svg>

        </button>

    </div>

</div>

<script
type="module"
src="javascript/call.js"></script>

</body>

</html>
